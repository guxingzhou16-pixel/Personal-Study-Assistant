name: Windows checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run format:check
      - run: node --test scripts/package-notices.test.mjs scripts/verify-package.test.mjs
      # Durable SQLite writes on Windows runners need a bounded integration-test budget.
      - run: npm test -- --testTimeout=30000
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-failure
          path: |
            test-results/
            artifacts/
          retention-days: 7
